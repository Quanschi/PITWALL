<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passwort zurücksetzen — Pitwall</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --carbon:#111317;
  --panel:#1B1E24;
  --panel-2:#22262E;
  --line:#2E333C;
  --text:#E9E7E1;
  --muted:#8B9099;
  --amber:#FFB020;
  --red:#E85C4A;
  --violet:#A78BFA;
  --shadow-md:0 8px 24px rgba(0,0,0,0.3);
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--carbon);
  color:var(--text);
  font-family:'Inter',sans-serif;
  padding:20px;
}
.auth-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:26px 28px;
  box-shadow:var(--shadow-md);
  max-width:380px;
  width:100%;
}
.title{
  font-family:'Rajdhani',sans-serif;
  font-weight:700;
  font-size:22px;
  margin:0 0 4px 0;
}
.title span{color:var(--amber);}
.subtitle{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--muted);
  margin:0 0 20px 0;
}
.field{margin-bottom:16px;display:flex;flex-direction:column;gap:5px;}
.field label{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  letter-spacing:0.5px;
  text-transform:uppercase;
  color:var(--muted);
}
input[type="password"]{
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 12px;
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:14px;
  width:100%;
}
input:focus{outline:none;border-color:var(--violet);}
.form-message{
  margin:12px 0;
  font-size:12.5px;
  color:var(--red);
  background:rgba(232,92,74,0.1);
  padding:8px 12px;
  border-radius:8px;
}
.form-message.success{color:var(--violet);background:rgba(167,139,250,0.1);}
button[type="submit"]{
  width:100%;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  letter-spacing:0.5px;
  text-transform:uppercase;
  padding:11px;
  border-radius:8px;
  border:1px solid var(--amber);
  background:var(--amber);
  color:var(--carbon);
  cursor:pointer;
  transition:all .2s var(--ease);
}
button[type="submit"]:hover{filter:brightness(1.08);}
button[type="submit"]:disabled{opacity:0.6;cursor:default;}
[hidden]{display:none!important;}
</style>
</head>
<body>

<div class="auth-card">
  <p class="title">Pit<span>wall</span></p>
  <p class="subtitle">Neues Passwort setzen</p>
  <form id="recovery-form">
    <div class="field">
      <label for="recovery-password">Neues Passwort</label>
      <input type="password" id="recovery-password" autocomplete="new-password" required minlength="6">
    </div>
    <div class="form-message" id="recovery-message" hidden></div>
    <button type="submit" id="recovery-submit">Passwort speichern</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const PITWALL_SUPABASE_URL = 'https://ieufpcrfvwacayrlieos.supabase.co';
const PITWALL_SUPABASE_KEY = 'sb_publishable_nJjfh-bU2mQoJfn4AIYMHw_QRjRU9rq';
const pitwallClient = supabase.createClient(PITWALL_SUPABASE_URL, PITWALL_SUPABASE_KEY);

function showMessage(text, isSuccess){
  const el = document.getElementById('recovery-message');
  el.textContent = text;
  el.hidden = false;
  el.classList.toggle('success', !!isSuccess);
}

// The recovery link's "?code=" (or older "#access_token=") is consumed
// automatically by supabase-js on load (detectSessionInUrl); a "?code="
// link still needs an explicit exchange on some project configs.
(async () => {
  const code = new URLSearchParams(window.location.search).get('code');
  if(code) await pitwallClient.auth.exchangeCodeForSession(code).catch(() => {});
})();

document.getElementById('recovery-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  document.getElementById('recovery-message').hidden = true;
  const password = document.getElementById('recovery-password').value;
  const submitBtn = document.getElementById('recovery-submit');
  submitBtn.disabled = true;
  const { error } = await pitwallClient.auth.updateUser({ password });
  if(error){
    showMessage('Der Link ist ungültig oder abgelaufen. Bitte fordere einen neuen an.');
    submitBtn.disabled = false;
    return;
  }
  await pitwallClient.auth.signOut();
  showMessage('Passwort erfolgreich geändert — du wirst zum Login weitergeleitet…', true);
  setTimeout(() => { window.location.href = 'index.html'; }, 1500);
});
</script>

</body>
</html>
