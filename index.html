<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111317">
<meta name="description" content="Pitwall — LMU GT3 / F1 / Endurance Fahrer-Briefing">
<title>Pitwall — Quanschi</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --carbon:#111317;
  --panel:#1B1E24;
  --panel-2:#22262E;
  --line:#2E333C;
  --text:#E9E7E1;
  --muted:#8B9099;
  --amber:#FFB020;
  --amber-dim:#8A5F1A;
  --teal:#3ED6C4;
  --teal-dim:#1F5F58;
  --red:#E85C4A;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--carbon);
  background-image:
    radial-gradient(circle at 15% 0%, rgba(255,176,32,0.06), transparent 40%),
    radial-gradient(circle at 85% 100%, rgba(62,214,196,0.05), transparent 40%);
  color:var(--text);
  font-family:'Inter',sans-serif;
  padding:0 0 60px 0;
}

/* ---- Header / signature: racing line divider ---- */
.header{
  padding:28px 32px 18px 32px;
  border-bottom:1px solid var(--line);
}
.header-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  flex-wrap:wrap;
  gap:12px;
}
.title{
  font-family:'Rajdhani',sans-serif;
  font-weight:700;
  font-size:34px;
  letter-spacing:0.5px;
  margin:0;
  text-transform:uppercase;
  color:var(--text);
}
.title span{color:var(--amber);}
.subtitle{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}
.stamp{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--muted);
  text-align:right;
  line-height:1.6;
}
.stamp b{color:var(--teal);}
.raceline{
  width:100%;
  height:14px;
  margin-top:16px;
}

/* ---- Tabs ---- */
.tabs{
  display:flex;
  gap:2px;
  padding:0 32px;
  margin-top:20px;
}
.tab{
  font-family:'Rajdhani',sans-serif;
  font-weight:600;
  font-size:15px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  padding:12px 22px;
  background:var(--panel);
  color:var(--muted);
  cursor:pointer;
  border:1px solid var(--line);
  border-bottom:none;
  transition:all .15s ease;
}
.tab.active{
  color:var(--carbon);
  background:var(--amber);
  border-color:var(--amber);
}
.tab.active.weekly{
  background:var(--teal);
  border-color:var(--teal);
}
.tab.active.schedule{
  background:var(--red);
  border-color:var(--red);
}
.tab:hover:not(.active){
  color:var(--text);
}

.panel{
  padding:26px 32px 10px 32px;
  display:none;
}
.panel.active{display:block;}

/* ---- Cards ---- */
.section-label{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--muted);
  margin:26px 0 10px 0;
}
.section-label:first-child{margin-top:0;}

.tip-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-left:4px solid var(--amber);
  border-radius:4px;
  padding:22px 24px;
}
.tip-card.weekly-card{border-left-color:var(--teal);}
.tip-kicker{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--amber);
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:8px;
}
.weekly-card .tip-kicker{color:var(--teal);}
.tip-headline{
  font-family:'Rajdhani',sans-serif;
  font-weight:700;
  font-size:22px;
  margin:0 0 10px 0;
  color:var(--text);
  line-height:1.25;
}
.tip-body{
  font-size:14.5px;
  line-height:1.65;
  color:#CBCBC5;
}
.tip-body b{color:var(--text);}
.tip-body code{
  font-family:'JetBrains Mono',monospace;
  background:var(--panel-2);
  padding:1px 6px;
  border-radius:3px;
  color:var(--amber);
  font-size:13px;
}
.weekly-card .tip-body code{color:var(--teal);}

.drill{
  margin-top:16px;
  background:var(--panel-2);
  border-radius:4px;
  padding:14px 16px;
  font-family:'JetBrains Mono',monospace;
  font-size:12.5px;
  color:var(--muted);
  border-left:2px solid var(--amber-dim);
}
.weekly-card .drill{border-left-color:var(--teal-dim);}
.drill b{color:var(--text);font-family:'Inter',sans-serif;}

/* ---- News list ---- */
.news-list{
  display:flex;
  flex-direction:column;
  gap:1px;
  background:var(--line);
  border-radius:4px;
  overflow:hidden;
}
.news-item{
  background:var(--panel);
  padding:14px 18px;
  display:flex;
  gap:14px;
  align-items:flex-start;
}
.news-tag{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:0.5px;
  padding:3px 8px;
  border-radius:3px;
  white-space:nowrap;
  margin-top:1px;
}
.tag-f1{background:rgba(232,92,74,0.15);color:var(--red);}
.tag-gt3{background:rgba(255,176,32,0.15);color:var(--amber);}
.tag-lmu{background:rgba(62,214,196,0.15);color:var(--teal);}
.tag-oval{background:rgba(139,144,153,0.2);color:var(--muted);}
.news-text{font-size:13.5px;line-height:1.5;color:#D5D5CF;}
.news-text b{color:var(--text);}

.sources-row{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px 14px;
  margin-top:12px;
  padding:10px 14px;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
}
.sources-label{color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.source-link{color:var(--amber);text-decoration:none;border-bottom:1px solid transparent;}
.source-link:hover{border-bottom-color:var(--amber);}

/* ---- Schedule tab ---- */
.filter-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:4px 0 18px 0;
}
.filter-pill{
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  letter-spacing:0.5px;
  text-transform:uppercase;
  padding:7px 14px;
  border-radius:20px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--muted);
  cursor:pointer;
  transition:all .15s ease;
}
.filter-pill.active{background:var(--red);border-color:var(--red);color:var(--carbon);}
.filter-pill:hover:not(.active){color:var(--text);}

.schedule-list{display:flex;flex-direction:column;gap:10px;}
.schedule-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-left:4px solid var(--red);
  border-radius:4px;
  padding:16px 18px;
}
.schedule-card-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:6px;
}
.schedule-circuit{
  font-family:'Rajdhani',sans-serif;
  font-weight:700;
  font-size:17px;
  color:var(--text);
}
.schedule-difficulty-badge{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  padding:2px 8px;
  border-radius:3px;
  text-transform:uppercase;
  background:rgba(232,92,74,0.15);
  color:var(--red);
  white-space:nowrap;
}
.schedule-classes{font-size:12.5px;color:var(--muted);margin-bottom:10px;}
.schedule-times{display:flex;flex-wrap:wrap;gap:8px;}
.schedule-time-chip{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  background:var(--panel-2);
  padding:5px 10px;
  border-radius:3px;
  color:var(--text);
}
.schedule-time-chip.next{border:1px solid var(--red);color:var(--red);}
.schedule-empty{color:var(--muted);font-size:13px;padding:10px 0;}
.schedule-status{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--muted);
  margin-bottom:14px;
}

/* ---- Weekly deep dive structure ---- */
.deepdive-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
  margin-top:16px;
}
.dd-box{
  background:var(--panel-2);
  border-radius:4px;
  padding:14px 16px;
  border-top:2px solid var(--teal-dim);
}
.dd-box h4{
  font-family:'Rajdhani',sans-serif;
  font-size:14px;
  letter-spacing:0.5px;
  text-transform:uppercase;
  margin:0 0 6px 0;
  color:var(--teal);
}
.dd-box p{
  font-size:12.5px;
  line-height:1.55;
  color:var(--muted);
  margin:0;
}

.footer-note{
  margin-top:30px;
  padding-top:16px;
  border-top:1px solid var(--line);
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
}

.sync-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:8px;
}
.sync-btn{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  letter-spacing:0.5px;
  text-transform:uppercase;
  background:none;
  border:1px solid var(--line);
  color:var(--muted);
  padding:4px 10px;
  border-radius:3px;
  cursor:pointer;
}
.sync-btn:hover{color:var(--text);border-color:var(--muted);}
.sync-state{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);}
.sync-state.stale{color:var(--amber);}

@media(max-width:640px){
  .header{padding:22px 18px 14px 18px;}
  .tabs, .panel{padding-left:18px;padding-right:18px;}
  .title{font-size:26px;}
  .deepdive-grid{grid-template-columns:1fr;}
  .header-top{flex-direction:column;align-items:flex-start;}
  .stamp{text-align:left;}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <p class="title">Pit<span>wall</span></p>
      <p class="subtitle">LMU GT3 · F1 · Endurance — Quanschi's Fahrer-Briefing</p>
    </div>
    <div class="stamp">
      STAND <b id="stamp-date">—</b><br>
      <span id="sync-state" class="sync-state">wird geladen…</span>
      <div class="sync-row">
        <button class="sync-btn" id="sync-btn" type="button">Jetzt aktualisieren</button>
      </div>
    </div>
  </div>
  <svg class="raceline" viewBox="0 0 800 14" preserveAspectRatio="none">
    <polyline points="0,7 100,7 130,2 180,12 230,7 400,7 430,2 480,12 530,7 800,7"
      fill="none" stroke="#FFB020" stroke-width="1.5" opacity="0.6"/>
  </svg>
</div>

<div class="tabs">
  <div class="tab active" id="tab-daily" onclick="showPanel('daily')">Daily</div>
  <div class="tab weekly" id="tab-weekly" onclick="showPanel('weekly')">Weekly</div>
  <div class="tab schedule" id="tab-schedule" onclick="showPanel('schedule')">Schedule</div>
</div>

<!-- DAILY -->
<div class="panel active" id="panel-daily">

  <p class="section-label" id="daily-section-label">Tipp des Tages · LMGT3</p>
  <div class="tip-card">
    <div class="tip-kicker" id="daily-tip-kicker"></div>
    <p class="tip-headline" id="daily-tip-headline"></p>
    <div class="tip-body" id="daily-tip-body"></div>
    <div class="drill">
      <b id="daily-drill-label"></b> <span id="daily-drill-body"></span>
    </div>
  </div>

  <p class="section-label" id="news-label">Racing News</p>
  <div class="news-list" id="news-list"></div>

  <div class="sources-row">
    <span class="sources-label">Quellen:</span>
    <a class="source-link" href="https://www.formula1.com/" target="_blank" rel="noopener">Formula1.com</a>
    <a class="source-link" href="https://www.lemansultimate.com/news" target="_blank" rel="noopener">LMU News</a>
    <a class="source-link" href="https://www.gt-world-challenge-europe.com/" target="_blank" rel="noopener">GT World Challenge</a>
    <a class="source-link" href="https://www.imsa.com/" target="_blank" rel="noopener">IMSA</a>
    <a class="source-link" href="https://www.fiawec.com/" target="_blank" rel="noopener">FIA WEC</a>
  </div>

</div>

<!-- WEEKLY -->
<div class="panel" id="panel-weekly">

  <p class="section-label" id="weekly-section-label">Strategie der Woche · LMGT3</p>
  <div class="tip-card weekly-card">
    <div class="tip-kicker" id="weekly-tip-kicker"></div>
    <p class="tip-headline" id="weekly-tip-headline"></p>
    <div class="tip-body" id="weekly-tip-body"></div>
    <div class="drill">
      <b id="weekly-drill-label"></b> <span id="weekly-drill-body"></span>
    </div>
  </div>

  <p class="section-label" id="deepdive-label"></p>
  <div class="deepdive-grid" id="deepdive-grid"></div>

  <div class="footer-note" id="footer-note"></div>

</div>

<!-- SCHEDULE -->
<div class="panel" id="panel-schedule">

  <p class="section-label">Rennart</p>
  <div class="filter-row" id="race-type-filter">
    <button class="filter-pill" data-type="daily" type="button">Daily Races</button>
    <button class="filter-pill" data-type="weekly" type="button">Weekly Races</button>
    <button class="filter-pill" data-type="special" type="button">Special Event</button>
  </div>

  <p class="section-label">Schwierigkeit</p>
  <div class="filter-row" id="difficulty-filter">
    <button class="filter-pill" data-difficulty="Beginner" type="button">Beginner</button>
    <button class="filter-pill" data-difficulty="Intermediate" type="button">Intermediate</button>
    <button class="filter-pill" data-difficulty="Advanced" type="button">Advanced</button>
  </div>

  <div class="schedule-status" id="schedule-status">Lade Rennplan…</div>
  <div class="schedule-list" id="schedule-list"></div>

</div>

<script>
const DATA_URL = 'data.json';

function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// Minimal markdown-lite: escapes everything first, then allows **bold** and `code`.
function mdLite(str){
  let out = escapeHtml(str);
  out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
  out = out.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  return out;
}

function setText(id, value){
  const el = document.getElementById(id);
  if(el) el.textContent = value || '';
}
function setHtml(id, value){
  const el = document.getElementById(id);
  if(el) el.innerHTML = mdLite(value || '');
}

function renderNews(items){
  const list = document.getElementById('news-list');
  list.innerHTML = '';
  (items || []).forEach(item => {
    const row = document.createElement('div');
    row.className = 'news-item';
    const tag = document.createElement('span');
    tag.className = 'news-tag ' + escapeHtml(item.tag_class || 'tag-oval').replace(/[^a-z0-9-]/gi,'');
    tag.textContent = item.tag_label || '';
    const text = document.createElement('span');
    text.className = 'news-text';
    text.innerHTML = mdLite(item.text || '');
    row.appendChild(tag);
    row.appendChild(text);
    list.appendChild(row);
  });
}

function renderDeepdive(boxes){
  const grid = document.getElementById('deepdive-grid');
  grid.innerHTML = '';
  (boxes || []).forEach(box => {
    const el = document.createElement('div');
    el.className = 'dd-box';
    const h4 = document.createElement('h4');
    h4.textContent = box.title || '';
    const p = document.createElement('p');
    p.innerHTML = mdLite(box.text || '');
    el.appendChild(h4);
    el.appendChild(p);
    grid.appendChild(el);
  });
}

function render(data){
  setText('stamp-date', data.stamp_date);

  setText('daily-section-label', data.daily.section_label);
  setText('daily-tip-kicker', data.daily.tip.kicker);
  setText('daily-tip-headline', data.daily.tip.headline);
  setHtml('daily-tip-body', data.daily.tip.body);
  setText('daily-drill-label', data.daily.tip.drill_label);
  setHtml('daily-drill-body', data.daily.tip.drill);
  setText('news-label', data.daily.news_label);
  renderNews(data.daily.news);

  setText('weekly-section-label', data.weekly.section_label);
  setText('weekly-tip-kicker', data.weekly.strategy.kicker);
  setText('weekly-tip-headline', data.weekly.strategy.headline);
  setHtml('weekly-tip-body', data.weekly.strategy.body);
  setText('weekly-drill-label', data.weekly.strategy.drill_label);
  setHtml('weekly-drill-body', data.weekly.strategy.drill);
  setText('deepdive-label', data.weekly.deepdive_label);
  renderDeepdive(data.weekly.deepdive);
  setText('footer-note', data.weekly.footer_note);
}

function setSyncState(text, stale){
  const el = document.getElementById('sync-state');
  el.textContent = text;
  el.classList.toggle('stale', !!stale);
}

const CACHE_KEY = 'pitwall-data-cache';

async function loadData(force){
  try{
    const res = await fetch(DATA_URL + (force ? ('?t=' + Date.now()) : ''), { cache: force ? 'no-store' : 'default' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    render(data);
    const ts = data.generated_at ? new Date(data.generated_at) : new Date();
    setSyncState('aktuell · generiert ' + ts.toLocaleString('de-DE'), false);
  }catch(err){
    const cached = localStorage.getItem(CACHE_KEY);
    if(cached){
      render(JSON.parse(cached));
      setSyncState('offline · zeige letzten Stand', true);
    }else{
      setSyncState('Fehler beim Laden der Daten', true);
    }
  }
}

document.getElementById('sync-btn').addEventListener('click', () => loadData(true));

// ---- Schedule tab: live data straight from the public lmuschedule.com API ----
const SCHEDULE_API_URL = 'https://api.lmuschedule.com/racingschedules';
const SCHEDULE_CACHE_KEY = 'pitwall-schedule-cache';
let scheduleData = null;
let scheduleLoaded = false;
let scheduleFilters = { type: 'daily', difficulty: 'Beginner' };

function typeMatches(raw, key){
  const s = (raw || '').toLowerCase();
  if(key === 'daily') return s.includes('daily');
  if(key === 'weekly') return s.includes('weekly');
  if(key === 'special') return s.includes('special');
  return false;
}

function formatLocalTime(iso){
  const d = new Date(iso);
  const weekday = d.toLocaleDateString('de-DE', { weekday: 'short' });
  const date = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
  const time = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  return `${weekday} ${date}, ${time}`;
}

function renderSchedule(){
  const list = document.getElementById('schedule-list');
  const status = document.getElementById('schedule-status');
  list.innerHTML = '';

  if(!scheduleData){
    status.textContent = 'Rennplan konnte nicht geladen werden.';
    return;
  }

  const now = Date.now();
  const entries = scheduleData
    .filter(e => typeMatches(e.raceType, scheduleFilters.type) && e.difficulty === scheduleFilters.difficulty)
    .map(e => {
      const upcoming = (e.times || [])
        .filter(t => new Date(t).getTime() >= now)
        .sort()
        .slice(0, 6);
      return { entry: e, upcoming };
    })
    .filter(x => x.upcoming.length > 0)
    .sort((a, b) => new Date(a.upcoming[0]) - new Date(b.upcoming[0]));

  if(entries.length === 0){
    status.textContent = 'Keine anstehenden Termine für diese Auswahl in den aktuell geladenen Daten.';
    return;
  }

  status.textContent = `${entries.length} Strecke${entries.length === 1 ? '' : 'n'} · Zeiten in deiner lokalen Zeitzone`;

  entries.forEach(({ entry, upcoming }) => {
    const card = document.createElement('div');
    card.className = 'schedule-card';

    const head = document.createElement('div');
    head.className = 'schedule-card-head';
    const circuit = document.createElement('span');
    circuit.className = 'schedule-circuit';
    circuit.textContent = entry.circuit || '';
    const badge = document.createElement('span');
    badge.className = 'schedule-difficulty-badge';
    badge.textContent = entry.difficulty || '';
    head.appendChild(circuit);
    head.appendChild(badge);

    const classes = document.createElement('div');
    classes.className = 'schedule-classes';
    classes.textContent = (entry.carClasses || []).join(' · ');

    const times = document.createElement('div');
    times.className = 'schedule-times';
    upcoming.forEach((t, i) => {
      const chip = document.createElement('span');
      chip.className = 'schedule-time-chip' + (i === 0 ? ' next' : '');
      chip.textContent = formatLocalTime(t);
      times.appendChild(chip);
    });

    card.appendChild(head);
    card.appendChild(classes);
    card.appendChild(times);
    list.appendChild(card);
  });
}

async function loadSchedule(force){
  const status = document.getElementById('schedule-status');
  if(!force && scheduleLoaded){
    renderSchedule();
    return;
  }
  try{
    const res = await fetch(SCHEDULE_API_URL, { headers: { 'Content-Type': 'application/json' } });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const payload = await res.json();
    scheduleData = payload.body || payload;
    localStorage.setItem(SCHEDULE_CACHE_KEY, JSON.stringify(scheduleData));
    scheduleLoaded = true;
    renderSchedule();
  }catch(err){
    const cached = localStorage.getItem(SCHEDULE_CACHE_KEY);
    if(cached){
      scheduleData = JSON.parse(cached);
      scheduleLoaded = true;
      renderSchedule();
      status.textContent += ' (evtl. veraltet, Live-Abruf fehlgeschlagen)';
    }else{
      status.textContent = 'Rennplan konnte nicht geladen werden (offline?).';
    }
  }
}

document.getElementById('race-type-filter').addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-pill');
  if(!btn) return;
  scheduleFilters.type = btn.dataset.type;
  document.querySelectorAll('#race-type-filter .filter-pill').forEach(b => b.classList.toggle('active', b === btn));
  renderSchedule();
});

document.getElementById('difficulty-filter').addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-pill');
  if(!btn) return;
  scheduleFilters.difficulty = btn.dataset.difficulty;
  document.querySelectorAll('#difficulty-filter .filter-pill').forEach(b => b.classList.toggle('active', b === btn));
  renderSchedule();
});

document.querySelector(`#race-type-filter .filter-pill[data-type="${scheduleFilters.type}"]`).classList.add('active');
document.querySelector(`#difficulty-filter .filter-pill[data-difficulty="${scheduleFilters.difficulty}"]`).classList.add('active');

function showPanel(name){
  document.getElementById('panel-daily').classList.toggle('active', name==='daily');
  document.getElementById('panel-weekly').classList.toggle('active', name==='weekly');
  document.getElementById('panel-schedule').classList.toggle('active', name==='schedule');
  document.getElementById('tab-daily').classList.toggle('active', name==='daily');
  document.getElementById('tab-weekly').classList.toggle('active', name==='weekly');
  document.getElementById('tab-schedule').classList.toggle('active', name==='schedule');
  if(name === 'schedule') loadSchedule(false);
}

loadData(false);

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>

</body>
</html>
