<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111317">
<meta name="description" content="Pitwall — LMU Tipps & Rennplan Fahrer-Briefing">
<title>Pitwall — Quanschi</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --carbon:#111317;
  --panel:#1B1E24;
  --panel-2:#22262E;
  --line:#2E333C;
  --text:#E9E7E1;
  --muted:#8B9099;
  --amber:#FFB020;
  --amber-dim:#8A5F1A;
  --teal:#3ED6C4;
  --teal-dim:#1F5F58;
  --red:#E85C4A;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--carbon);
  background-image:
    radial-gradient(circle at 15% 0%, rgba(255,176,32,0.06), transparent 40%),
    radial-gradient(circle at 85% 100%, rgba(62,214,196,0.05), transparent 40%);
  color:var(--text);
  font-family:'Inter',sans-serif;
  padding:0 0 60px 0;
}

/* ---- Header / signature: racing line divider ---- */
.header{
  padding:28px 32px 18px 32px;
  border-bottom:1px solid var(--line);
}
.header-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  flex-wrap:wrap;
  gap:12px;
}
.title{
  font-family:'Rajdhani',sans-serif;
  font-weight:700;
  font-size:34px;
  letter-spacing:0.5px;
  margin:0;
  text-transform:uppercase;
  color:var(--text);
}
.title span{color:var(--amber);}
.subtitle{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}
.stamp{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--muted);
  text-align:right;
  line-height:1.6;
}
.stamp b{color:var(--teal);}
.raceline{
  width:100%;
  height:14px;
  margin-top:16px;
}

/* ---- Tabs ---- */
.tabs{
  display:flex;
  gap:2px;
  padding:0 32px;
  margin-top:20px;
}
.tab{
  font-family:'Rajdhani',sans-serif;
  font-weight:600;
  font-size:15px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  padding:12px 22px;
  background:var(--panel);
  color:var(--muted);
  cursor:pointer;
  border:1px solid var(--line);
  border-bottom:none;
  transition:all .15s ease;
}
.tab.active{
  color:var(--carbon);
  background:var(--amber);
  border-color:var(--amber);
}
.tab.active.weekly{
  background:var(--teal);
  border-color:var(--teal);
}
.tab.active.schedule{
  background:var(--red);
  border-color:var(--red);
}
.tab:hover:not(.active){
  color:var(--text);
}

.panel{
  padding:26px 32px 10px 32px;
  display:none;
}
.panel.active{display:block;}

/* ---- Cards ---- */
.section-label{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--muted);
  margin:26px 0 10px 0;
}
.section-label:first-child{margin-top:0;}

.tip-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-left:4px solid var(--amber);
  border-radius:4px;
  padding:22px 24px;
}
.tip-card.weekly-card{border-left-color:var(--teal);}
.tip-kicker{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--amber);
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:8px;
}
.weekly-card .tip-kicker{color:var(--teal);}
.tip-headline{
  font-family:'Rajdhani',sans-serif;
  font-weight:700;
  font-size:22px;
  margin:0 0 10px 0;
  color:var(--text);
  line-height:1.25;
}
.tip-body{
  font-size:14.5px;
  line-height:1.65;
  color:#CBCBC5;
}
.tip-body b{color:var(--text);}
.tip-body code{
  font-family:'JetBrains Mono',monospace;
  background:var(--panel-2);
  padding:1px 6px;
  border-radius:3px;
  color:var(--amber);
  font-size:13px;
}
.weekly-card .tip-body code{color:var(--teal);}

.drill{
  margin-top:16px;
  background:var(--panel-2);
  border-radius:4px;
  padding:14px 16px;
  font-family:'JetBrains Mono',monospace;
  font-size:12.5px;
  color:var(--muted);
  border-left:2px solid var(--amber-dim);
}
.weekly-card .drill{border-left-color:var(--teal-dim);}
.drill b{color:var(--text);font-family:'Inter',sans-serif;}

/* ---- Schedule tab ---- */
.filter-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:4px 0 18px 0;
}
.filter-pill{
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  letter-spacing:0.5px;
  text-transform:uppercase;
  padding:7px 14px;
  border-radius:20px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--muted);
  cursor:pointer;
  transition:all .15s ease;
}
.filter-pill.active{background:var(--red);border-color:var(--red);color:var(--carbon);}
.filter-pill:hover:not(.active){color:var(--text);}

.schedule-status{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--muted);
  margin-bottom:14px;
}
.schedule-status a{color:var(--red);}
.schedule-counter{white-space:nowrap;color:var(--muted);}

.schedule-carousel{
  position:relative;
  height:min(64vh, 560px);
  min-height:400px;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;
  border:1px solid var(--line);
  border-radius:4px;
  background:var(--panel);
}
.schedule-card{
  scroll-snap-align:start;
  scroll-snap-stop:always;
  height:100%;
  padding:22px 24px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  overflow-y:auto;
  border-bottom:1px solid var(--line);
  cursor:pointer;
}
.schedule-card.expanded{justify-content:flex-start;}
.schedule-card:last-child{border-bottom:none;}
.schedule-card-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:4px;
}
.schedule-circuit{
  font-family:'Rajdhani',sans-serif;
  font-weight:700;
  font-size:26px;
  color:var(--text);
  line-height:1.15;
}
.schedule-tier-badge{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  padding:3px 9px;
  border-radius:3px;
  text-transform:uppercase;
  background:rgba(232,92,74,0.15);
  color:var(--red);
  white-space:nowrap;
  margin-top:2px;
}
.schedule-series{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--amber);
  letter-spacing:0.5px;
  margin-bottom:2px;
}
.schedule-meta{font-size:13px;color:var(--muted);margin-bottom:16px;}
.schedule-times-label{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:8px;
}
.schedule-countdown{
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  letter-spacing:0.3px;
  text-transform:none;
  color:var(--red);
  white-space:nowrap;
}
.schedule-times{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(56px, 1fr));
  gap:6px;
}
.schedule-time-chip{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  background:var(--panel-2);
  padding:5px 4px;
  border-radius:3px;
  color:var(--text);
  text-align:center;
}
.schedule-time-chip.next{border:1px solid var(--red);color:var(--red);}
.schedule-time-chip.past{color:var(--muted);text-decoration:line-through;opacity:0.55;}

.schedule-date-groups{display:flex;flex-direction:column;gap:6px;}
.schedule-date-group{}
.schedule-date-toggle{
  width:100%;
  text-align:left;
  font-family:'JetBrains Mono',monospace;
  font-size:12.5px;
  letter-spacing:0.3px;
  color:var(--text);
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:3px;
  padding:8px 12px;
  cursor:pointer;
}
.schedule-date-toggle.open{border-color:var(--red);color:var(--red);}
.schedule-date-times{margin:8px 2px 0 2px;}
.schedule-details-toggle{
  margin-top:14px;
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  letter-spacing:0.5px;
  color:var(--muted);
}
.schedule-details{
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 16px;
}
.schedule-detail-item{font-size:12px;}
.schedule-detail-label{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:2px;
}
.schedule-detail-value{color:var(--text);}
.schedule-swipe-hint{
  margin-top:18px;
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  color:var(--muted);
  text-align:center;
}
.schedule-empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  font-size:13px;
  padding:0 24px;
  text-align:center;
}
.schedule-tbd{
  font-size:13px;
  color:var(--muted);
  background:var(--panel-2);
  border-radius:3px;
  padding:10px 12px;
}

/* ---- Weekly deep dive structure ---- */
.deepdive-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
  margin-top:16px;
}
.dd-box{
  background:var(--panel-2);
  border-radius:4px;
  padding:14px 16px;
  border-top:2px solid var(--teal-dim);
}
.dd-box h4{
  font-family:'Rajdhani',sans-serif;
  font-size:14px;
  letter-spacing:0.5px;
  text-transform:uppercase;
  margin:0 0 6px 0;
  color:var(--teal);
}
.dd-box p{
  font-size:12.5px;
  line-height:1.55;
  color:var(--muted);
  margin:0;
}

.footer-note{
  margin-top:30px;
  padding-top:16px;
  border-top:1px solid var(--line);
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
}

.sync-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:8px;
}
.sync-btn{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  letter-spacing:0.5px;
  text-transform:uppercase;
  background:none;
  border:1px solid var(--line);
  color:var(--muted);
  padding:4px 10px;
  border-radius:3px;
  cursor:pointer;
}
.sync-btn:hover{color:var(--text);border-color:var(--muted);}
.sync-state{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);}
.sync-state.stale{color:var(--amber);}

@media(max-width:640px){
  .header{padding:22px 18px 14px 18px;}
  .tabs, .panel{padding-left:18px;padding-right:18px;}
  .title{font-size:26px;}
  .deepdive-grid{grid-template-columns:1fr;}
  .header-top{flex-direction:column;align-items:flex-start;}
  .stamp{text-align:left;}
}
</style>

<script>
const DATA_URL = 'data.json';

function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// Minimal markdown-lite: escapes everything first, then allows **bold** and `code`.
function mdLite(str){
  let out = escapeHtml(str);
  out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
  out = out.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  return out;
}

function setText(id, value){
  const el = document.getElementById(id);
  if(el) el.textContent = value || '';
}
function setHtml(id, value){
  const el = document.getElementById(id);
  if(el) el.innerHTML = mdLite(value || '');
}

function renderDeepdive(boxes){
  const grid = document.getElementById('deepdive-grid');
  grid.innerHTML = '';
  (boxes || []).forEach(box => {
    const el = document.createElement('div');
    el.className = 'dd-box';
    const h4 = document.createElement('h4');
    h4.textContent = box.title || '';
    const p = document.createElement('p');
    p.innerHTML = mdLite(box.text || '');
    el.appendChild(h4);
    el.appendChild(p);
    grid.appendChild(el);
  });
}

function render(data){
  setText('stamp-date', data.stamp_date);

  setText('daily-section-label', data.daily.section_label);
  setText('daily-tip-kicker', data.daily.tip.kicker);
  setText('daily-tip-headline', data.daily.tip.headline);
  setHtml('daily-tip-body', data.daily.tip.body);
  setText('daily-drill-label', data.daily.tip.drill_label);
  setHtml('daily-drill-body', data.daily.tip.drill);

  setText('weekly-section-label', data.weekly.section_label);
  setText('weekly-tip-kicker', data.weekly.strategy.kicker);
  setText('weekly-tip-headline', data.weekly.strategy.headline);
  setHtml('weekly-tip-body', data.weekly.strategy.body);
  setText('weekly-drill-label', data.weekly.strategy.drill_label);
  setHtml('weekly-drill-body', data.weekly.strategy.drill);
  setText('deepdive-label', data.weekly.deepdive_label);
  renderDeepdive(data.weekly.deepdive);
  setText('footer-note', data.weekly.footer_note);
}

function setSyncState(text, stale){
  const el = document.getElementById('sync-state');
  el.textContent = text;
  el.classList.toggle('stale', !!stale);
}

const CACHE_KEY = 'pitwall-data-cache';

async function loadData(force){
  try{
    const res = await fetch(DATA_URL + (force ? ('?t=' + Date.now()) : ''), { cache: force ? 'no-store' : 'default' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    render(data);
    const ts = data.generated_at ? new Date(data.generated_at) : new Date();
    setSyncState('aktuell · generiert ' + ts.toLocaleString('de-DE'), false);
  }catch(err){
    const cached = localStorage.getItem(CACHE_KEY);
    if(cached){
      render(JSON.parse(cached));
      setSyncState('offline · zeige letzten Stand', true);
    }else{
      setSyncState('Fehler beim Laden der Daten', true);
    }
  }
}

document.getElementById('sync-btn').addEventListener('click', () => {
  loadData(true);
  // The button should refresh everything "live", not just the daily/weekly
  // tip text - clear the schedule cache too and reload it if that tab is open.
  Object.keys(scheduleCache).forEach(key => delete scheduleCache[key]);
  if(document.getElementById('panel-schedule').classList.contains('active')){
    loadScheduleView();
  }
});

// ---- Schedule tab: own cards rendered from lmuportal.com's public Supabase
// data (their anon key + open REST API are meant for direct client use,
// unlike lmuschedule.com's origin-locked API) ----
const SUPABASE_URL = 'https://db.lmuportal.space';
const SUPABASE_ANON_KEY = 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSIsImlhdCI6MTc3Njg3MDc4MCwiZXhwIjo0OTMyNTQ0MzgwLCJyb2xlIjoiYW5vbiJ9.aE59DqdkNMhjsD82MmAc2AYnwp2KENVjzoHTyWmUx3Y';

let scheduleFilters = { type: 'daily', difficulty: 'beginner' };
const scheduleCache = {};

function mostRecentTuesdayUtc(date){
  const d = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));
  const diff = (d.getUTCDay() + 5) % 7; // days since the last Tuesday
  d.setUTCDate(d.getUTCDate() - diff);
  return d;
}
function toWeekKey(date){
  return date.toISOString().slice(0, 10);
}

async function supabaseSelect(table, query){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function timesFromTodayList(hhmmssList){
  return (hhmmssList || []).map(t => {
    const [hh, mm, ss] = t.split(':').map(Number);
    const d = new Date();
    d.setUTCHours(hh, mm, ss || 0, 0);
    return d;
  });
}

// race_days/times_utc describe a weekly-recurring pattern anchored to week_key
// (the Tuesday that rotation went live). weekOffset shifts by whole weeks so
// weekly races can fall back to "next week" once this week's slots are done.
function occurrencesForWeek(weekKeyStr, raceDays, timesUtc, weekOffset){
  const anchor = new Date(weekKeyStr + 'T00:00:00Z');
  const anchorDow = anchor.getUTCDay();
  const out = [];
  (raceDays || []).forEach(targetDow => {
    const dayOffset = (targetDow - anchorDow + 7) % 7 + weekOffset * 7;
    (timesUtc || []).forEach(t => {
      const [hh, mm, ss] = t.split(':').map(Number);
      const dt = new Date(anchor);
      dt.setUTCDate(dt.getUTCDate() + dayOffset);
      dt.setUTCHours(hh, mm, ss || 0, 0);
      out.push(dt);
    });
  });
  return out;
}

const WEEKDAY_NAMES_DE = ['So', 'Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa'];

async function fetchScheduleCards(type, difficulty){
  const cacheKey = `${type}:${difficulty}`;
  if(scheduleCache[cacheKey]) return scheduleCache[cacheKey];

  const cols = 'series_id,tier_name,track_name,series_name,car_classes,race_duration_minutes,todays_start_times_utc,race_days,times_utc,week_key,setup,tyre_warmers,tyre_allowance,fuel_multiplier,driver_swap_enabled,sr_requirement,race_weather';
  const tierFilter = difficulty === 'all' ? '' : `&tier_name=eq.${difficulty}`;
  const currentWeekKey = toWeekKey(mostRecentTuesdayUtc(new Date()));
  let rows;
  if(type === 'special'){
    rows = await supabaseSelect('race_series',
      `select=${cols}&type=eq.special${tierFilter}&hidden=eq.false&schedule_status=eq.active&limit=200`);
  }else{
    rows = await supabaseSelect('race_series',
      `select=${cols}&type=eq.${type}${tierFilter}&hidden=eq.false&schedule_status=eq.active&week_key=lte.${currentWeekKey}&order=week_key.desc&limit=200`);
    if(rows.length){
      const latestWeek = rows[0].week_key;
      rows = rows.filter(r => r.week_key === latestWeek);
    }
  }

  const now = Date.now();
  const cards = rows.map(r => {
    let times;
    if(type === 'daily'){
      // Daily races only ever cover "today" - no other day is meaningful here.
      times = timesFromTodayList(r.todays_start_times_utc);
    }else{
      times = occurrencesForWeek(r.week_key, r.race_days, r.times_utc, 0);
      if(type === 'weekly' && times.length > 0 && times.every(d => d.getTime() < now)){
        times = occurrencesForWeek(r.week_key, r.race_days, r.times_utc, 1);
      }
    }
    times.sort((a, b) => a - b);
    return Object.assign({}, r, { times, type });
  })
  .filter(c => {
    if(c.times.some(d => d.getTime() >= now)) return true;
    // Special events sometimes get announced (track/days) before Studio 397
    // publishes exact start times - show those as "time TBD" instead of
    // hiding them, as long as the event itself isn't already in the past.
    if(type === 'special' && c.times.length === 0 && (c.race_days || []).length > 0 && c.week_key >= currentWeekKey){
      c.timesUnknown = true;
      return true;
    }
    return false;
  })
  .sort((a, b) => {
    const farFuture = 8640000000000000;
    const keyOf = c => {
      const next = c.times.find(d => d.getTime() >= now);
      if(next) return next.getTime();
      if(c.timesUnknown) return new Date(c.week_key + 'T00:00:00Z').getTime();
      return farFuture;
    };
    return keyOf(a) - keyOf(b);
  });

  scheduleCache[cacheKey] = cards;
  return cards;
}

// Sky codes aren't officially documented anywhere we could find - this is a
// reasonable best-effort reading of the observed 0-3 range, not confirmed by
// Studio 397/lmuportal docs.
function skyLabel(code){
  const n = parseInt(code, 10);
  if(isNaN(n)) return null;
  if(n <= 0) return 'Sonnig';
  if(n === 1) return 'Leicht bewölkt';
  if(n === 2) return 'Bewölkt';
  if(n === 3) return 'Stark bewölkt';
  return 'Regen möglich';
}

function dayNightLabel(timeOfDay, startTimeMinutes){
  let hour = null;
  const m = /^(\d+)h/.exec(timeOfDay || '');
  if(m){
    hour = parseInt(m[1], 10);
  }else if(startTimeMinutes !== undefined && startTimeMinutes !== null){
    hour = Math.floor(Number(startTimeMinutes) / 60) % 24;
  }
  if(hour === null || isNaN(hour)) return null;
  return (hour < 6 || hour >= 20) ? 'Nacht' : 'Tag';
}

// Best-effort reading of real_road/water_depth - Studio 397/lmuportal don't
// publicly document these values, so this is an approximation, not a
// guaranteed-accurate reading.
function trackConditionLabel(seg){
  if(!seg) return null;
  const wdRaw = seg.water_depth !== undefined ? seg.water_depth : seg.waterDepth;
  const wd = wdRaw === undefined || wdRaw === null ? null : parseFloat(wdRaw);
  const rr = String(seg.real_road || seg.realRoad || '').toUpperCase();
  if(rr.includes('SATURATED') || rr.includes('FLOOD')) return 'Nass';
  if(rr.includes('WET')) return 'Nass';
  if(rr.includes('DAMP')) return 'Feucht';
  if(wd !== null){
    if(wd > 0.3) return 'Nass';
    if(wd > 0) return 'Feucht';
    return 'Trocken';
  }
  if(rr.includes('DRY') || rr.includes('GREEN') || rr.includes('FAST') || rr === 'NATURAL') return 'Trocken';
  return null;
}

function summarizeWeather(weatherField){
  let segments = weatherField;
  if(segments && !Array.isArray(segments) && Array.isArray(segments.weather)) segments = segments.weather;
  if(!Array.isArray(segments) || segments.length === 0) return null;
  const num = (seg, keyA, keyB) => {
    const v = seg[keyA] !== undefined ? seg[keyA] : seg[keyB];
    return v === undefined || v === null ? null : parseFloat(v);
  };
  const first = segments[0];
  const temp = num(first, 'temperature', 'temperature');
  const humidity = num(first, 'humidity', 'humidity');
  const wind = num(first, 'windSpeed', 'wind_speed');
  const sky = skyLabel(first.sky);
  const dayNight = dayNightLabel(first.time_of_day || first.timeOfDay, first.start_time !== undefined ? first.start_time : first.startTime);
  const rainValues = segments.map(s => num(s, 'rainChange', 'rain_change')).filter(v => v !== null);
  const maxRain = rainValues.length ? Math.max(...rainValues) : null;
  // real_road/water_depth are only present on some entries; when missing but
  // rain chance is known and 0 throughout, "dry" is still a safe inference.
  let track = trackConditionLabel(first);
  if(!track && maxRain === 0) track = 'Trocken';
  return { temp, humidity, wind, maxRain, sky, dayNight, track };
}

function buildScheduleDetails(card){
  const items = [];
  if(card.setup) items.push(['Setup', card.setup]);
  if(card.tyre_warmers !== null && card.tyre_warmers !== undefined){
    items.push(['Tyre Warmers', card.tyre_warmers ? 'Aktiviert' : 'Deaktiviert']);
  }
  if(card.tyre_allowance !== null && card.tyre_allowance !== undefined){
    items.push(['Reifensätze', String(card.tyre_allowance)]);
  }
  if(card.fuel_multiplier !== null && card.fuel_multiplier !== undefined){
    items.push(['Rank Multiplikator', `${card.fuel_multiplier}×`]);
  }
  if(card.driver_swap_enabled !== null && card.driver_swap_enabled !== undefined){
    items.push(['Fahrerwechsel', card.driver_swap_enabled ? 'Ja' : 'Nein']);
  }
  if(card.sr_requirement) items.push(['SR-Anforderung', card.sr_requirement]);

  const weather = summarizeWeather(card.race_weather);
  if(weather){
    if(weather.dayNight) items.push(['Tageszeit', weather.dayNight]);
    if(weather.sky) items.push(['Wetter', weather.sky]);
    if(weather.track) items.push(['Strecke', weather.track]);
    if(weather.temp !== null) items.push(['Temperatur', `${weather.temp}°C`]);
    if(weather.maxRain !== null) items.push(['Regenwahrscheinlichkeit', `${weather.maxRain}%`]);
    if(weather.humidity !== null) items.push(['Luftfeuchtigkeit', `${weather.humidity}%`]);
    if(weather.wind !== null) items.push(['Wind', String(weather.wind)]);
  }
  return items;
}

function formatScheduleTime(date){
  return date.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
}

function formatCountdown(msRemaining){
  if(msRemaining <= 0) return 'Jetzt';
  const totalMin = Math.floor(msRemaining / 60000);
  const days = Math.floor(totalMin / 1440);
  const hours = Math.floor((totalMin % 1440) / 60);
  const mins = totalMin % 60;
  if(days > 0) return `Startet in ${days}T ${hours}Std`;
  if(hours > 0) return `Startet in ${hours}Std ${mins}Min`;
  return `Startet in ${mins}Min`;
}

// One shared interval keeps every visible countdown accurate without
// re-rendering the whole schedule (which would reset scroll/expand state).
setInterval(() => {
  document.querySelectorAll('.schedule-countdown').forEach(el => {
    const target = Number(el.dataset.target);
    if(!target) return;
    el.textContent = formatCountdown(target - Date.now());
  });
}, 15000);

function buildTimesGrid(cardTimes, now){
  const times = document.createElement('div');
  times.className = 'schedule-times';
  let nextMarked = false;
  cardTimes.forEach(t => {
    const chip = document.createElement('span');
    const isPast = t.getTime() < now;
    let cls = 'schedule-time-chip';
    if(isPast) cls += ' past';
    else if(!nextMarked){ cls += ' next'; nextMarked = true; }
    chip.className = cls;
    chip.textContent = formatScheduleTime(t);
    times.appendChild(chip);
  });
  return times;
}

function dateGroupKey(date){
  return date.toLocaleDateString('de-DE', { year: 'numeric', month: '2-digit', day: '2-digit' });
}
function dateGroupLabel(date){
  const weekday = date.toLocaleDateString('de-DE', { weekday: 'long' });
  const day = date.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
  return `${weekday}, ${day}`;
}

// Weekly/Special races can span several days - group by local calendar date,
// each date collapsed behind a tap except the one holding the next upcoming
// race, so the card stays compact until you ask for more.
function buildTimesByDate(cardTimes, now){
  const wrap = document.createElement('div');
  wrap.className = 'schedule-date-groups';

  const groups = [];
  const byKey = {};
  cardTimes.forEach(t => {
    const key = dateGroupKey(t);
    if(!byKey[key]){
      byKey[key] = { key, date: t, times: [] };
      groups.push(byKey[key]);
    }
    byKey[key].times.push(t);
  });

  let nextGroupKey = null;
  for(const g of groups){
    if(g.times.some(t => t.getTime() >= now)){ nextGroupKey = g.key; break; }
  }

  groups.forEach(g => {
    const section = document.createElement('div');
    section.className = 'schedule-date-group';

    const header = document.createElement('button');
    header.type = 'button';
    header.className = 'schedule-date-toggle';
    header.textContent = dateGroupLabel(g.date) + ' ▾';

    const body = buildTimesGrid(g.times, now);
    body.classList.add('schedule-date-times');
    const isOpen = g.key === nextGroupKey;
    body.style.display = isOpen ? 'grid' : 'none';
    header.classList.toggle('open', isOpen);

    header.addEventListener('click', (e) => {
      e.stopPropagation();
      const nowOpen = body.style.display !== 'none';
      body.style.display = nowOpen ? 'none' : 'grid';
      header.classList.toggle('open', !nowOpen);
    });

    section.appendChild(header);
    section.appendChild(body);
    wrap.appendChild(section);
  });

  return wrap;
}

function renderScheduleCards(cards){
  const carousel = document.getElementById('schedule-carousel');
  const statusText = document.getElementById('schedule-status-text');
  const counter = document.getElementById('schedule-counter');
  carousel.innerHTML = '';

  if(cards.length === 0){
    statusText.textContent = 'Keine anstehenden Termine für diese Auswahl gefunden.';
    counter.textContent = '';
    const empty = document.createElement('div');
    empty.className = 'schedule-empty';
    empty.textContent = 'Nichts Passendes gefunden — evtl. eine andere Kombination probieren.';
    carousel.appendChild(empty);
    return;
  }

  statusText.textContent = 'Live-Daten · Zeiten in deiner lokalen Zeitzone';
  counter.textContent = `1 / ${cards.length}`;
  const now = Date.now();

  cards.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'schedule-card';

    const head = document.createElement('div');
    head.className = 'schedule-card-head';
    const circuit = document.createElement('span');
    circuit.className = 'schedule-circuit';
    circuit.textContent = card.track_name || '';
    const badge = document.createElement('span');
    badge.className = 'schedule-tier-badge';
    badge.textContent = card.tier_name || '';
    head.appendChild(circuit);
    head.appendChild(badge);

    const series = document.createElement('div');
    series.className = 'schedule-series';
    series.textContent = card.series_name || '';

    const metaParts = [];
    if(card.car_classes && card.car_classes.length) metaParts.push(card.car_classes.join(' · '));
    if(card.race_duration_minutes) metaParts.push(`${card.race_duration_minutes} Min`);
    const meta = document.createElement('div');
    meta.className = 'schedule-meta';
    meta.textContent = metaParts.join(' · ');

    const timesLabel = document.createElement('div');
    timesLabel.className = 'schedule-times-label';
    const timesLabelText = document.createElement('span');
    timesLabelText.textContent = card.timesUnknown
      ? 'Termin'
      : (card.type === 'daily' ? 'Heute · deine Zeitzone' : 'Termine · deine Zeitzone');
    timesLabel.appendChild(timesLabelText);

    const nextTime = card.times.find(t => t.getTime() >= now);
    if(nextTime){
      const countdown = document.createElement('span');
      countdown.className = 'schedule-countdown';
      countdown.dataset.target = nextTime.getTime();
      countdown.textContent = formatCountdown(nextTime.getTime() - now);
      timesLabel.appendChild(countdown);
    }

    let times;
    if(card.timesUnknown){
      times = document.createElement('div');
      times.className = 'schedule-tbd';
      const dayNames = (card.race_days || []).slice()
        .sort((a, b) => (a + 6) % 7 - (b + 6) % 7) // Monday-first order for display
        .map(d => WEEKDAY_NAMES_DE[d]).join('/');
      const weekDate = new Date(card.week_key + 'T00:00:00Z');
      const weekLabel = weekDate.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
      times.textContent = `Zeit noch nicht bekannt · ${dayNames || 'Tag offen'}, Woche vom ${weekLabel}`;
    }else if(card.type === 'daily'){
      times = buildTimesGrid(card.times, now);
    }else{
      times = buildTimesByDate(card.times, now);
    }

    const toggle = document.createElement('div');
    toggle.className = 'schedule-details-toggle';
    toggle.textContent = 'Tippen für Bedingungen ▾';

    const detailsBlock = document.createElement('div');
    detailsBlock.className = 'schedule-details';
    detailsBlock.style.display = 'none';
    const detailItems = buildScheduleDetails(card);
    if(detailItems.length === 0){
      const none = document.createElement('div');
      none.className = 'schedule-detail-item';
      none.textContent = 'Keine weiteren Bedingungsdaten verfügbar.';
      detailsBlock.appendChild(none);
    }else{
      detailItems.forEach(([label, value]) => {
        const item = document.createElement('div');
        item.className = 'schedule-detail-item';
        const l = document.createElement('div');
        l.className = 'schedule-detail-label';
        l.textContent = label;
        const v = document.createElement('div');
        v.className = 'schedule-detail-value';
        v.textContent = value;
        item.appendChild(l);
        item.appendChild(v);
        detailsBlock.appendChild(item);
      });
    }

    el.appendChild(head);
    el.appendChild(series);
    el.appendChild(meta);
    el.appendChild(timesLabel);
    el.appendChild(times);
    el.appendChild(toggle);
    el.appendChild(detailsBlock);

    el.addEventListener('click', (e) => {
      if(e.target.closest('.schedule-times')) return;
      const isOpen = detailsBlock.style.display !== 'none';
      detailsBlock.style.display = isOpen ? 'none' : 'grid';
      toggle.textContent = isOpen ? 'Tippen für Bedingungen ▾' : 'Weniger anzeigen ▴';
      el.classList.toggle('expanded', !isOpen);
    });

    if(i < cards.length - 1){
      const hint = document.createElement('div');
      hint.className = 'schedule-swipe-hint';
      hint.textContent = '↓ runterwischen für die nächste Strecke';
      el.appendChild(hint);
    }

    carousel.appendChild(el);
  });
}

let scheduleScrollBound = false;
function bindScheduleScrollCounter(){
  if(scheduleScrollBound) return;
  scheduleScrollBound = true;
  const carousel = document.getElementById('schedule-carousel');
  carousel.addEventListener('scroll', () => {
    const total = carousel.querySelectorAll('.schedule-card').length;
    if(!total || !carousel.clientHeight) return;
    const idx = Math.round(carousel.scrollTop / carousel.clientHeight);
    document.getElementById('schedule-counter').textContent = `${Math.min(idx + 1, total)} / ${total}`;
  });
}

async function loadScheduleView(){
  // Capture which filters this call is for, so a slow response that arrives
  // after the user already switched filters again doesn't overwrite the
  // (correct) result of a later, faster request.
  const requestType = scheduleFilters.type;
  const requestDifficulty = scheduleFilters.difficulty;
  const isStale = () => requestType !== scheduleFilters.type || requestDifficulty !== scheduleFilters.difficulty;

  document.getElementById('schedule-status-text').textContent = 'Lade Rennplan…';
  try{
    const cards = await fetchScheduleCards(requestType, requestDifficulty);
    if(isStale()) return;
    renderScheduleCards(cards);
    bindScheduleScrollCounter();
  }catch(err){
    if(isStale()) return;
    document.getElementById('schedule-status-text').textContent = 'Rennplan konnte nicht geladen werden (offline?).';
    document.getElementById('schedule-counter').textContent = '';
    document.getElementById('schedule-carousel').innerHTML = '';
  }
}

document.getElementById('race-type-filter').addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-pill');
  if(!btn) return;
  scheduleFilters.type = btn.dataset.type;
  document.querySelectorAll('#race-type-filter .filter-pill').forEach(b => b.classList.toggle('active', b === btn));
  loadScheduleView();
});

document.getElementById('difficulty-filter').addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-pill');
  if(!btn) return;
  scheduleFilters.difficulty = btn.dataset.difficulty;
  document.querySelectorAll('#difficulty-filter .filter-pill').forEach(b => b.classList.toggle('active', b === btn));
  loadScheduleView();
});

document.querySelector(`#race-type-filter .filter-pill[data-type="${scheduleFilters.type}"]`).classList.add('active');
document.querySelector(`#difficulty-filter .filter-pill[data-difficulty="${scheduleFilters.difficulty}"]`).classList.add('active');

let scheduleFirstLoadDone = false;
function showPanel(name){
  document.getElementById('panel-daily').classList.toggle('active', name==='daily');
  document.getElementById('panel-weekly').classList.toggle('active', name==='weekly');
  document.getElementById('panel-schedule').classList.toggle('active', name==='schedule');
  document.getElementById('tab-daily').classList.toggle('active', name==='daily');
  document.getElementById('tab-weekly').classList.toggle('active', name==='weekly');
  document.getElementById('tab-schedule').classList.toggle('active', name==='schedule');
  if(name === 'schedule' && !scheduleFirstLoadDone){
    scheduleFirstLoadDone = true;
    loadScheduleView();
  }
}

loadData(false);

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    // updateViaCache:'none' makes the browser always fetch sw.js itself over
    // the network for update checks, bypassing GitHub Pages' 10-minute
    // Cache-Control instead of just polling more often against a stale copy.
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      // GitHub Pages caches sw.js like any other file (10 min), so browsers
      // can go a while without noticing a new version on their own. Forcing
      // an update check here and whenever the app becomes visible again
      // gets new content live for reopened tabs/installed PWAs much faster.
      reg.update().catch(() => {});
      document.addEventListener('visibilitychange', () => {
        if(!document.hidden) reg.update().catch(() => {});
      });
    }).catch(() => {});
  });
}
