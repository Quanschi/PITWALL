<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111317">
<meta name="description" content="Pitwall — LMU GT3 / F1 / Endurance Fahrer-Briefing">
<title>Pitwall — Quanschi</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --carbon:#111317;
  --panel:#1B1E24;
  --panel-2:#22262E;
  --line:#2E333C;
  --text:#E9E7E1;
  --muted:#8B9099;
  --amber:#FFB020;
  --amber-dim:#8A5F1A;
  --teal:#3ED6C4;
  --teal-dim:#1F5F58;
  --red:#E85C4A;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--carbon);
  background-image:
    radial-gradient(circle at 15% 0%, rgba(255,176,32,0.06), transparent 40%),
    radial-gradient(circle at 85% 100%, rgba(62,214,196,0.05), transparent 40%);
  color:var(--text);
  font-family:'Inter',sans-serif;
  padding:0 0 60px 0;
}

/* ---- Header / signature: racing line divider ---- */
.header{
  padding:28px 32px 18px 32px;
  border-bottom:1px solid var(--line);
}
.header-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  flex-wrap:wrap;
  gap:12px;
}
.title{
  font-family:'Rajdhani',sans-serif;
  font-weight:700;
  font-size:34px;
  letter-spacing:0.5px;
  margin:0;
  text-transform:uppercase;
  color:var(--text);
}
.title span{color:var(--amber);}
.subtitle{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}
.stamp{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--muted);
  text-align:right;
  line-height:1.6;
}
.stamp b{color:var(--teal);}
.raceline{
  width:100%;
  height:14px;
  margin-top:16px;
}

/* ---- Tabs ---- */
.tabs{
  display:flex;
  gap:2px;
  padding:0 32px;
  margin-top:20px;
}
.tab{
  font-family:'Rajdhani',sans-serif;
  font-weight:600;
  font-size:15px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  padding:12px 22px;
  background:var(--panel);
  color:var(--muted);
  cursor:pointer;
  border:1px solid var(--line);
  border-bottom:none;
  transition:all .15s ease;
}
.tab.active{
  color:var(--carbon);
  background:var(--amber);
  border-color:var(--amber);
}
.tab.active.weekly{
  background:var(--teal);
  border-color:var(--teal);
}
.tab.active.schedule{
  background:var(--red);
  border-color:var(--red);
}
.tab:hover:not(.active){
  color:var(--text);
}

.panel{
  padding:26px 32px 10px 32px;
  display:none;
}
.panel.active{display:block;}

/* ---- Cards ---- */
.section-label{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--muted);
  margin:26px 0 10px 0;
}
.section-label:first-child{margin-top:0;}

.tip-card{
  background:var(--panel);
  border:1px solid var(--line);
  border-left:4px solid var(--amber);
  border-radius:4px;
  padding:22px 24px;
}
.tip-card.weekly-card{border-left-color:var(--teal);}
.tip-kicker{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--amber);
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:8px;
}
.weekly-card .tip-kicker{color:var(--teal);}
.tip-headline{
  font-family:'Rajdhani',sans-serif;
  font-weight:700;
  font-size:22px;
  margin:0 0 10px 0;
  color:var(--text);
  line-height:1.25;
}
.tip-body{
  font-size:14.5px;
  line-height:1.65;
  color:#CBCBC5;
}
.tip-body b{color:var(--text);}
.tip-body code{
  font-family:'JetBrains Mono',monospace;
  background:var(--panel-2);
  padding:1px 6px;
  border-radius:3px;
  color:var(--amber);
  font-size:13px;
}
.weekly-card .tip-body code{color:var(--teal);}

.drill{
  margin-top:16px;
  background:var(--panel-2);
  border-radius:4px;
  padding:14px 16px;
  font-family:'JetBrains Mono',monospace;
  font-size:12.5px;
  color:var(--muted);
  border-left:2px solid var(--amber-dim);
}
.weekly-card .drill{border-left-color:var(--teal-dim);}
.drill b{color:var(--text);font-family:'Inter',sans-serif;}

/* ---- News list ---- */
.news-list{
  display:flex;
  flex-direction:column;
  gap:1px;
  background:var(--line);
  border-radius:4px;
  overflow:hidden;
}
.news-item{
  background:var(--panel);
  padding:14px 18px;
  display:flex;
  gap:14px;
  align-items:flex-start;
}
.news-tag{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:0.5px;
  padding:3px 8px;
  border-radius:3px;
  white-space:nowrap;
  margin-top:1px;
}
.tag-f1{background:rgba(232,92,74,0.15);color:var(--red);}
.tag-gt3{background:rgba(255,176,32,0.15);color:var(--amber);}
.tag-lmu{background:rgba(62,214,196,0.15);color:var(--teal);}
.tag-oval{background:rgba(139,144,153,0.2);color:var(--muted);}
.news-text{font-size:13.5px;line-height:1.5;color:#D5D5CF;}
.news-text b{color:var(--text);}

.sources-row{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px 14px;
  margin-top:12px;
  padding:10px 14px;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
}
.sources-label{color:var(--muted);letter-spacing:1px;text-transform:uppercase;}
.source-link{color:var(--amber);text-decoration:none;border-bottom:1px solid transparent;}
.source-link:hover{border-bottom-color:var(--amber);}

/* ---- Schedule tab ---- */
.filter-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:4px 0 18px 0;
}
.filter-pill{
  font-family:'JetBrains Mono',monospace;
  font-size:11.5px;
  letter-spacing:0.5px;
  text-transform:uppercase;
  padding:7px 14px;
  border-radius:20px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--muted);
  cursor:pointer;
  transition:all .15s ease;
}
.filter-pill.active{background:var(--red);border-color:var(--red);color:var(--carbon);}
.filter-pill:hover:not(.active){color:var(--text);}

.schedule-status{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:10px;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--muted);
  margin-bottom:14px;
}
.schedule-status a{color:var(--red);}
.schedule-counter{white-space:nowrap;color:var(--muted);}

.schedule-carousel{
  position:relative;
  height:min(64vh, 560px);
  min-height:400px;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;
  border:1px solid var(--line);
  border-radius:4px;
  background:var(--panel);
}
.schedule-card{
  scroll-snap-align:start;
  scroll-snap-stop:always;
  height:100%;
  padding:22px 24px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  border-bottom:1px solid var(--line);
}
.schedule-card:last-child{border-bottom:none;}
.schedule-card-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:4px;
}
.schedule-circuit{
  font-family:'Rajdhani',sans-serif;
  font-weight:700;
  font-size:26px;
  color:var(--text);
  line-height:1.15;
}
.schedule-tier-badge{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  padding:3px 9px;
  border-radius:3px;
  text-transform:uppercase;
  background:rgba(232,92,74,0.15);
  color:var(--red);
  white-space:nowrap;
  margin-top:2px;
}
.schedule-series{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  color:var(--amber);
  letter-spacing:0.5px;
  margin-bottom:2px;
}
.schedule-meta{font-size:13px;color:var(--muted);margin-bottom:16px;}
.schedule-times-label{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:8px;
}
.schedule-times{display:flex;flex-wrap:wrap;gap:8px;}
.schedule-time-chip{
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  background:var(--panel-2);
  padding:6px 12px;
  border-radius:3px;
  color:var(--text);
}
.schedule-time-chip.next{border:1px solid var(--red);color:var(--red);}
.schedule-swipe-hint{
  margin-top:18px;
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  color:var(--muted);
  text-align:center;
}
.schedule-empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--muted);
  font-size:13px;
  padding:0 24px;
  text-align:center;
}

/* ---- Weekly deep dive structure ---- */
.deepdive-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
  margin-top:16px;
}
.dd-box{
  background:var(--panel-2);
  border-radius:4px;
  padding:14px 16px;
  border-top:2px solid var(--teal-dim);
}
.dd-box h4{
  font-family:'Rajdhani',sans-serif;
  font-size:14px;
  letter-spacing:0.5px;
  text-transform:uppercase;
  margin:0 0 6px 0;
  color:var(--teal);
}
.dd-box p{
  font-size:12.5px;
  line-height:1.55;
  color:var(--muted);
  margin:0;
}

.footer-note{
  margin-top:30px;
  padding-top:16px;
  border-top:1px solid var(--line);
  font-size:12px;
  color:var(--muted);
  line-height:1.6;
}

.sync-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:8px;
}
.sync-btn{
  font-family:'JetBrains Mono',monospace;
  font-size:10.5px;
  letter-spacing:0.5px;
  text-transform:uppercase;
  background:none;
  border:1px solid var(--line);
  color:var(--muted);
  padding:4px 10px;
  border-radius:3px;
  cursor:pointer;
}
.sync-btn:hover{color:var(--text);border-color:var(--muted);}
.sync-state{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);}
.sync-state.stale{color:var(--amber);}

@media(max-width:640px){
  .header{padding:22px 18px 14px 18px;}
  .tabs, .panel{padding-left:18px;padding-right:18px;}
  .title{font-size:26px;}
  .deepdive-grid{grid-template-columns:1fr;}
  .header-top{flex-direction:column;align-items:flex-start;}
  .stamp{text-align:left;}
}
</style>
</head>

<script>
const DATA_URL = 'data.json';

function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// Minimal markdown-lite: escapes everything first, then allows **bold** and `code`.
function mdLite(str){
  let out = escapeHtml(str);
  out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
  out = out.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  return out;
}

function setText(id, value){
  const el = document.getElementById(id);
  if(el) el.textContent = value || '';
}
function setHtml(id, value){
  const el = document.getElementById(id);
  if(el) el.innerHTML = mdLite(value || '');
}

function renderNews(items){
  const list = document.getElementById('news-list');
  list.innerHTML = '';
  (items || []).forEach(item => {
    const row = document.createElement('div');
    row.className = 'news-item';
    const tag = document.createElement('span');
    tag.className = 'news-tag ' + escapeHtml(item.tag_class || 'tag-oval').replace(/[^a-z0-9-]/gi,'');
    tag.textContent = item.tag_label || '';
    const text = document.createElement('span');
    text.className = 'news-text';
    text.innerHTML = mdLite(item.text || '');
    row.appendChild(tag);
    row.appendChild(text);
    list.appendChild(row);
  });
}

function renderDeepdive(boxes){
  const grid = document.getElementById('deepdive-grid');
  grid.innerHTML = '';
  (boxes || []).forEach(box => {
    const el = document.createElement('div');
    el.className = 'dd-box';
    const h4 = document.createElement('h4');
    h4.textContent = box.title || '';
    const p = document.createElement('p');
    p.innerHTML = mdLite(box.text || '');
    el.appendChild(h4);
    el.appendChild(p);
    grid.appendChild(el);
  });
}

function render(data){
  setText('stamp-date', data.stamp_date);

  setText('daily-section-label', data.daily.section_label);
  setText('daily-tip-kicker', data.daily.tip.kicker);
  setText('daily-tip-headline', data.daily.tip.headline);
  setHtml('daily-tip-body', data.daily.tip.body);
  setText('daily-drill-label', data.daily.tip.drill_label);
  setHtml('daily-drill-body', data.daily.tip.drill);
  setText('news-label', data.daily.news_label);
  renderNews(data.daily.news);

  setText('weekly-section-label', data.weekly.section_label);
  setText('weekly-tip-kicker', data.weekly.strategy.kicker);
  setText('weekly-tip-headline', data.weekly.strategy.headline);
  setHtml('weekly-tip-body', data.weekly.strategy.body);
  setText('weekly-drill-label', data.weekly.strategy.drill_label);
  setHtml('weekly-drill-body', data.weekly.strategy.drill);
  setText('deepdive-label', data.weekly.deepdive_label);
  renderDeepdive(data.weekly.deepdive);
  setText('footer-note', data.weekly.footer_note);
}

function setSyncState(text, stale){
  const el = document.getElementById('sync-state');
  el.textContent = text;
  el.classList.toggle('stale', !!stale);
}

const CACHE_KEY = 'pitwall-data-cache';

async function loadData(force){
  try{
    const res = await fetch(DATA_URL + (force ? ('?t=' + Date.now()) : ''), { cache: force ? 'no-store' : 'default' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    render(data);
    const ts = data.generated_at ? new Date(data.generated_at) : new Date();
    setSyncState('aktuell · generiert ' + ts.toLocaleString('de-DE'), false);
  }catch(err){
    const cached = localStorage.getItem(CACHE_KEY);
    if(cached){
      render(JSON.parse(cached));
      setSyncState('offline · zeige letzten Stand', true);
    }else{
      setSyncState('Fehler beim Laden der Daten', true);
    }
  }
}

document.getElementById('sync-btn').addEventListener('click', () => loadData(true));

// ---- Schedule tab: own cards rendered from lmuportal.com's public Supabase
// data (their anon key + open REST API are meant for direct client use,
// unlike lmuschedule.com's origin-locked API) ----
const SUPABASE_URL = 'https://db.lmuportal.space';
const SUPABASE_ANON_KEY = 'eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSIsImlhdCI6MTc3Njg3MDc4MCwiZXhwIjo0OTMyNTQ0MzgwLCJyb2xlIjoiYW5vbiJ9.aE59DqdkNMhjsD82MmAc2AYnwp2KENVjzoHTyWmUx3Y';

function mostRecentTuesdayUtc(date){
  const d = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate()));
  const diff = (d.getUTCDay() + 5) % 7; // days since the last Tuesday
  d.setUTCDate(d.getUTCDate() - diff);
  return d;
}
function toWeekKey(date){
  return date.toISOString().slice(0, 10);
}

async function supabaseSelect(table, query){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${query}`, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

// race_days/times_utc describe a weekly-recurring pattern anchored to week_key
// (the Tuesday that rotation went live). weekOffset shifts by whole weeks so
// we can fall back to "next week" once this week's slots are all in the past.
function occurrencesForWeek(weekKeyStr, raceDays, timesUtc, weekOffset){
  const anchor = new Date(weekKeyStr + 'T00:00:00Z');
  const anchorDow = anchor.getUTCDay();
  const out = [];
  (raceDays || []).forEach(targetDow => {
    const dayOffset = (targetDow - anchorDow + 7) % 7 + weekOffset * 7;
    (timesUtc || []).forEach(t => {
      const [hh, mm, ss] = t.split(':').map(Number);
      const dt = new Date(anchor);
      dt.setUTCDate(dt.getUTCDate() + dayOffset);
      dt.setUTCHours(hh, mm, ss || 0, 0);
      out.push(dt);
    });
  });
  return out;
}

function timesFromTodayList(hhmmssList, dayOffset){
  return (hhmmssList || []).map(t => {
    const [hh, mm, ss] = t.split(':').map(Number);
    const d = new Date();
    d.setUTCDate(d.getUTCDate() + dayOffset);
    d.setUTCHours(hh, mm, ss || 0, 0);
    return d;
  });
}

async function fetchScheduleCards(type, difficulty){
  const cacheKey = `${type}:${difficulty}`;
  if(scheduleCache[cacheKey]) return scheduleCache[cacheKey];

  const cols = 'series_id,tier_name,track_name,series_name,car_classes,race_duration_minutes,todays_start_times_utc,race_days,times_utc,week_key';
  let rows;
  if(type === 'special'){
    rows = await supabaseSelect('race_series',
      `select=${cols}&type=eq.special&tier_name=eq.${difficulty}&hidden=eq.false&schedule_status=eq.active&limit=200`);
  }else{
    const todayKey = toWeekKey(mostRecentTuesdayUtc(new Date()));
    rows = await supabaseSelect('race_series',
      `select=${cols}&type=eq.${type}&tier_name=eq.${difficulty}&hidden=eq.false&schedule_status=eq.active&week_key=lte.${todayKey}&order=week_key.desc&limit=200`);
    if(rows.length){
      const latestWeek = rows[0].week_key;
      rows = rows.filter(r => r.week_key === latestWeek);
    }
  }

  const now = Date.now();
  const cards = rows.map(r => {
    let times;
    if(type === 'daily'){
      times = timesFromTodayList(r.todays_start_times_utc, 0).filter(d => d.getTime() >= now);
      if(times.length === 0) times = timesFromTodayList(r.todays_start_times_utc, 1);
    }else if(type === 'special'){
      times = occurrencesForWeek(r.week_key, r.race_days, r.times_utc, 0).filter(d => d.getTime() >= now);
    }else{
      times = occurrencesForWeek(r.week_key, r.race_days, r.times_utc, 0).filter(d => d.getTime() >= now);
      if(times.length === 0) times = occurrencesForWeek(r.week_key, r.race_days, r.times_utc, 1);
    }
    times.sort((a, b) => a - b);
    return Object.assign({}, r, { times });
  })
  .filter(c => c.times.length > 0)
  .sort((a, b) => a.times[0] - b.times[0]);

  scheduleCache[cacheKey] = cards;
  return cards;
}

function formatScheduleTime(date){
  const weekday = date.toLocaleDateString('de-DE', { weekday: 'short' });
  const day = date.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' });
  const time = date.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  return `${weekday} ${day}, ${time}`;
}

function renderScheduleCards(cards){
  const carousel = document.getElementById('schedule-carousel');
  const statusText = document.getElementById('schedule-status-text');
  const counter = document.getElementById('schedule-counter');
  carousel.innerHTML = '';

  if(cards.length === 0){
    statusText.textContent = 'Keine anstehenden Termine für diese Auswahl gefunden.';
    counter.textContent = '';
    const empty = document.createElement('div');
    empty.className = 'schedule-empty';
    empty.textContent = 'Nichts Passendes gefunden — evtl. eine andere Kombination probieren.';
    carousel.appendChild(empty);
    return;
  }

  statusText.textContent = 'Live-Daten · Zeiten in deiner lokalen Zeitzone';
  counter.textContent = `1 / ${cards.length}`;

  cards.forEach((card, i) => {
    const el = document.createElement('div');
    el.className = 'schedule-card';

    const head = document.createElement('div');
    head.className = 'schedule-card-head';
    const circuit = document.createElement('span');
    circuit.className = 'schedule-circuit';
    circuit.textContent = card.track_name || '';
    const badge = document.createElement('span');
    badge.className = 'schedule-tier-badge';
    badge.textContent = card.tier_name || '';
    head.appendChild(circuit);
    head.appendChild(badge);

    const series = document.createElement('div');
    series.className = 'schedule-series';
    series.textContent = card.series_name || '';

    const metaParts = [];
    if(card.car_classes && card.car_classes.length) metaParts.push(card.car_classes.join(' · '));
    if(card.race_duration_minutes) metaParts.push(`${card.race_duration_minutes} Min`);
    const meta = document.createElement('div');
    meta.className = 'schedule-meta';
    meta.textContent = metaParts.join(' · ');

    const timesLabel = document.createElement('div');
    timesLabel.className = 'schedule-times-label';
    timesLabel.textContent = 'Nächste Termine';

    const times = document.createElement('div');
    times.className = 'schedule-times';
    card.times.slice(0, 6).forEach((t, idx) => {
      const chip = document.createElement('span');
      chip.className = 'schedule-time-chip' + (idx === 0 ? ' next' : '');
      chip.textContent = formatScheduleTime(t);
      times.appendChild(chip);
    });

    el.appendChild(head);
    el.appendChild(series);
    el.appendChild(meta);
    el.appendChild(timesLabel);
    el.appendChild(times);

    if(i < cards.length - 1){
      const hint = document.createElement('div');
      hint.className = 'schedule-swipe-hint';
      hint.textContent = '↓ runterwischen für die nächste Strecke';
      el.appendChild(hint);
    }

    carousel.appendChild(el);
  });
}

let scheduleScrollBound = false;
function bindScheduleScrollCounter(){
  if(scheduleScrollBound) return;
  scheduleScrollBound = true;
  const carousel = document.getElementById('schedule-carousel');
  carousel.addEventListener('scroll', () => {
    const total = carousel.querySelectorAll('.schedule-card').length;
    if(!total || !carousel.clientHeight) return;
    const idx = Math.round(carousel.scrollTop / carousel.clientHeight);
    document.getElementById('schedule-counter').textContent = `${Math.min(idx + 1, total)} / ${total}`;
  });
}

async function loadScheduleView(){
  document.getElementById('schedule-status-text').textContent = 'Lade Rennplan…';
  try{
    const cards = await fetchScheduleCards(scheduleFilters.type, scheduleFilters.difficulty);
    renderScheduleCards(cards);
    bindScheduleScrollCounter();
  }catch(err){
    document.getElementById('schedule-status-text').textContent = 'Rennplan konnte nicht geladen werden (offline?).';
    document.getElementById('schedule-counter').textContent = '';
    document.getElementById('schedule-carousel').innerHTML = '';
  }
}

document.getElementById('race-type-filter').addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-pill');
  if(!btn) return;
  scheduleFilters.type = btn.dataset.type;
  document.querySelectorAll('#race-type-filter .filter-pill').forEach(b => b.classList.toggle('active', b === btn));
  loadScheduleView();
});

document.getElementById('difficulty-filter').addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-pill');
  if(!btn) return;
  scheduleFilters.difficulty = btn.dataset.difficulty;
  document.querySelectorAll('#difficulty-filter .filter-pill').forEach(b => b.classList.toggle('active', b === btn));
  loadScheduleView();
});

document.querySelector(`#race-type-filter .filter-pill[data-type="${scheduleFilters.type}"]`).classList.add('active');
document.querySelector(`#difficulty-filter .filter-pill[data-difficulty="${scheduleFilters.difficulty}"]`).classList.add('active');

let scheduleFirstLoadDone = false;
function showPanel(name){
  document.getElementById('panel-daily').classList.toggle('active', name==='daily');
  document.getElementById('panel-weekly').classList.toggle('active', name==='weekly');
  document.getElementById('panel-schedule').classList.toggle('active', name==='schedule');
  document.getElementById('tab-daily').classList.toggle('active', name==='daily');
  document.getElementById('tab-weekly').classList.toggle('active', name==='weekly');
  document.getElementById('tab-schedule').classList.toggle('active', name==='schedule');
  if(name === 'schedule' && !scheduleFirstLoadDone){
    scheduleFirstLoadDone = true;
    loadScheduleView();
  }
}

loadData(false);

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
